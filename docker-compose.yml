services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Host 5432 is often taken (e.g. novagates-auth-postgres). Use 5434 locally.
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: alaridi
      POSTGRES_PASSWORD: alaridi
      POSTGRES_DB: al_aridi
    volumes:
      - al_aridi_pg:/var/lib/postgresql/data

volumes:
  al_aridi_pg:
